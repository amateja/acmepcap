[build-system]
requires = ['setuptools>=77.0.3']
build-backend = 'setuptools.build_meta'

[project]
name = 'acmepcap'
dynamic = ['version']
authors = [
  {name='Andrzej Mateja', email='mateja.and@gmail.com'}
]
description = 'Acme Packet sipmsg.log to packet capture converter.'
readme = 'README.rst'
license = 'MIT'
license-files = ['LICENSE']
keywords = ['Acme', 'AcmePacket', 'SBC', 'sipmsg']
requires-python = '>=3.9'
classifiers = [
    'Development Status :: 4 - Beta',
    'Environment :: Console',
    'Intended Audience :: System Administrators',
    'Intended Audience :: Telecommunications Industry',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Topic :: Communications :: Telephony',
    'Topic :: System :: Networking',
    'Topic :: Utilities'
]

[project.urls]
Homepage = 'https://github.com/amateja/acmepcap/'

[project.scripts]
acmepcap = 'acmepcap:main'

[project.optional-dependencies]
test = [
    'coverage[toml]',
    'coveralls',
    'mypy<2.0',
    'ruff'
]

[tool.setuptools.dynamic]
version = {attr = 'acmepcap.__version__'}

[tool.coverage.report]
exclude_lines = [
    'raise NotImplementedError',
    'if __name__ == .__main__.:',
    'if typing.TYPE_CHECKING:'
]

[tool.coverage.run]
branch = true

[tool.mypy]
python_version = '3.9'
files = ['acmepcap.py', 'tests']
show_error_codes = true
pretty = true
strict = true

[tool.ruff]
line-length = 79
target-version = 'py39'

[tool.ruff.lint]
select = ['ALL']
ignore = [
    # D203 conflicts with D211, and D213 conflicts with D212.
    # Keep Ruff's D211/D212 convention and silence conflict warnings.
    'D203',
    'D213',

    # __slots__ order is semantic in packet/parser data classes.
    'RUF023',

    # Final trailing commas are intentionally avoided in this project.
    'COM812',

    # The test suite intentionally uses unittest, not pytest.
    'PT',

    # Direct exception messages are clearer for this small CLI.
    'TRY003',
    'EM101',
    'EM102'
]
[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.mccabe]
max-complexity = 10
